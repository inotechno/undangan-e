<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600" fill="none">
  <defs>
    <linearGradient id="vineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="vineLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Main vine stem -->
  <path d="M100 0 C100 50, 80 100, 100 150 C120 200, 80 250, 100 300 C120 350, 80 400, 100 450 C120 500, 80 550, 100 600" 
        stroke="url(#vineGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Secondary vine -->
  <path d="M100 20 C110 60, 90 90, 105 130 C120 170, 85 210, 100 250 C115 290, 90 330, 105 370 C120 410, 85 450, 100 490 C115 530, 90 570, 100 600" 
        stroke="url(#vineGrad)" stroke-width="1.5" fill="none" stroke-opacity="0.5" stroke-linecap="round"/>
  
  <!-- Leaves along vine -->
  <g fill="url(#vineLeaf)">
    <!-- Top leaves -->
    <ellipse cx="75" cy="60" rx="22" ry="9" transform="rotate(-40 75 60)"/>
    <ellipse cx="125" cy="80" rx="20" ry="8" transform="rotate(35 125 80)"/>
    
    <!-- Upper middle leaves -->
    <ellipse cx="70" cy="140" rx="24" ry="10" transform="rotate(-45 70 140)"/>
    <ellipse cx="130" cy="160" rx="22" ry="9" transform="rotate(40 130 160)"/>
    
    <!-- Middle leaves -->
    <ellipse cx="75" cy="240" rx="25" ry="10" transform="rotate(-50 75 240)"/>
    <ellipse cx="125" cy="260" rx="23" ry="9" transform="rotate(45 125 260)"/>
    
    <!-- Lower middle leaves -->
    <ellipse cx="70" cy="340" rx="24" ry="10" transform="rotate(-45 70 340)"/>
    <ellipse cx="130" cy="360" rx="22" ry="9" transform="rotate(40 130 360)"/>
    
    <!-- Bottom leaves -->
    <ellipse cx="75" cy="440" rx="22" ry="9" transform="rotate(-40 75 440)"/>
    <ellipse cx="125" cy="460" rx="20" ry="8" transform="rotate(35 125 460)"/>
    
    <ellipse cx="80" cy="520" rx="20" ry="8" transform="rotate(-35 80 520)"/>
    <ellipse cx="120" cy="540" rx="18" ry="7" transform="rotate(30 120 540)"/>
  </g>
  
  <!-- Small buds/flowers -->
  <g fill="#0D9488">
    <circle cx="60" cy="100" r="4" fill-opacity="0.2"/>
    <circle cx="140" cy="200" r="3.5" fill-opacity="0.18"/>
    <circle cx="55" cy="300" r="4" fill-opacity="0.2"/>
    <circle cx="145" cy="400" r="3.5" fill-opacity="0.18"/>
    <circle cx="60" cy="500" r="3" fill-opacity="0.15"/>
  </g>
  
  <!-- Tiny leaves -->
  <g fill="url(#vineLeaf)">
    <ellipse cx="90" cy="40" rx="10" ry="4" transform="rotate(-30 90 40)"/>
    <ellipse cx="110" cy="55" rx="9" ry="3.5" transform="rotate(25 110 55)"/>
    <ellipse cx="85" cy="180" rx="10" ry="4" transform="rotate(-35 85 180)"/>
    <ellipse cx="115" cy="195" rx="9" ry="3.5" transform="rotate(30 115 195)"/>
    <ellipse cx="88" cy="280" rx="10" ry="4" transform="rotate(-30 88 280)"/>
    <ellipse cx="112" cy="295" rx="9" ry="3.5" transform="rotate(25 112 295)"/>
    <ellipse cx="85" cy="380" rx="10" ry="4" transform="rotate(-35 85 380)"/>
    <ellipse cx="115" cy="395" rx="9" ry="3.5" transform="rotate(30 115 395)"/>
    <ellipse cx="90" cy="480" rx="10" ry="4" transform="rotate(-30 90 480)"/>
    <ellipse cx="110" cy="495" rx="9" ry="3.5" transform="rotate(25 110 495)"/>
  </g>
  
  <!-- Decorative dots/sparkles -->
  <g fill="#0D9488" fill-opacity="0.15">
    <circle cx="50" cy="70" r="2"/>
    <circle cx="150" cy="120" r="1.5"/>
    <circle cx="45" cy="220" r="2"/>
    <circle cx="155" cy="270" r="1.5"/>
    <circle cx="50" cy="370" r="2"/>
    <circle cx="150" cy="420" r="1.5"/>
    <circle cx="55" cy="470" r="2"/>
    <circle cx="145" cy="550" r="1.5"/>
  </g>
</svg>
