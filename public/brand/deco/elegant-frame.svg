<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cornerLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Outer frame -->
  <rect x="20" y="20" width="1160" height="560" rx="8" stroke="url(#frameGrad)" stroke-width="1.5" fill="none"/>
  <rect x="40" y="40" width="1120" height="520" rx="4" stroke="url(#frameGrad)" stroke-width="1" fill="none" stroke-opacity="0.5"/>
  
  <!-- Corner ornaments - Top Left -->
  <g transform="translate(40, 40)">
    <path d="M0 80 L0 20 Q0 0 20 0 L80 0" stroke="#0D9488" stroke-width="2" fill="none" stroke-opacity="0.3"/>
    <path d="M10 80 L10 30 Q10 10 30 10 L80 10" stroke="#10B981" stroke-width="1" fill="none" stroke-opacity="0.2"/>
    
    <!-- Corner leaves -->
    <ellipse cx="25" cy="25" rx="18" ry="7" fill="url(#cornerLeaf)" transform="rotate(-45 25 25)"/>
    <ellipse cx="40" cy="15" rx="14" ry="6" fill="url(#cornerLeaf)" transform="rotate(-30 40 15)"/>
    <ellipse cx="15" cy="40" rx="14" ry="6" fill="url(#cornerLeaf)" transform="rotate(-60 15 40)"/>
    
    <!-- Small diamond -->
    <path d="M25 25 L30 30 L25 35 L20 30 Z" fill="#0D9488" fill-opacity="0.25"/>
  </g>
  
  <!-- Corner ornaments - Top Right -->
  <g transform="translate(1160, 40) scale(-1, 1)">
    <path d="M0 80 L0 20 Q0 0 20 0 L80 0" stroke="#0D9488" stroke-width="2" fill="none" stroke-opacity="0.3"/>
    <path d="M10 80 L10 30 Q10 10 30 10 L80 10" stroke="#10B981" stroke-width="1" fill="none" stroke-opacity="0.2"/>
    
    <ellipse cx="25" cy="25" rx="18" ry="7" fill="url(#cornerLeaf)" transform="rotate(-45 25 25)"/>
    <ellipse cx="40" cy="15" rx="14" ry="6" fill="url(#cornerLeaf)" transform="rotate(-30 40 15)"/>
    <ellipse cx="15" cy="40" rx="14" ry="6" fill="url(#cornerLeaf)" transform="rotate(-60 15 40)"/>
    
    <path d="M25 25 L30 30 L25 35 L20 30 Z" fill="#0D9488" fill-opacity="0.25"/>
  </g>
  
  <!-- Corner ornaments - Bottom Left -->
  <g transform="translate(40, 560) scale(1, -1)">
    <path d="M0 80 L0 20 Q0 0 20 0 L80 0" stroke="#0D9488" stroke-width="2" fill="none" stroke-opacity="0.3"/>
    <path d="M10 80 L10 30 Q10 10 30 10 L80 10" stroke="#10B981" stroke-width="1" fill="none" stroke-opacity="0.2"/>
    
    <ellipse cx="25" cy="25" rx="18" ry="7" fill="url(#cornerLeaf)" transform="rotate(-45 25 25)"/>
    <ellipse cx="40" cy="15" rx="14" ry="6" fill="url(#cornerLeaf)" transform="rotate(-30 40 15)"/>
    <ellipse cx="15" cy="40" rx="14" ry="6" fill="url(#cornerLeaf)" transform="rotate(-60 15 40)"/>
    
    <path d="M25 25 L30 30 L25 35 L20 30 Z" fill="#0D9488" fill-opacity="0.25"/>
  </g>
  
  <!-- Corner ornaments - Bottom Right -->
  <g transform="translate(1160, 560) scale(-1, -1)">
    <path d="M0 80 L0 20 Q0 0 20 0 L80 0" stroke="#0D9488" stroke-width="2" fill="none" stroke-opacity="0.3"/>
    <path d="M10 80 L10 30 Q10 10 30 10 L80 10" stroke="#10B981" stroke-width="1" fill="none" stroke-opacity="0.2"/>
    
    <ellipse cx="25" cy="25" rx="18" ry="7" fill="url(#cornerLeaf)" transform="rotate(-45 25 25)"/>
    <ellipse cx="40" cy="15" rx="14" ry="6" fill="url(#cornerLeaf)" transform="rotate(-30 40 15)"/>
    <ellipse cx="15" cy="40" rx="14" ry="6" fill="url(#cornerLeaf)" transform="rotate(-60 15 40)"/>
    
    <path d="M25 25 L30 30 L25 35 L20 30 Z" fill="#0D9488" fill-opacity="0.25"/>
  </g>
  
  <!-- Center top ornament -->
  <g transform="translate(600, 40)">
    <line x1="-100" y1="0" x2="-30" y2="0" stroke="url(#frameGrad)" stroke-width="1"/>
    <line x1="30" y1="0" x2="100" y2="0" stroke="url(#frameGrad)" stroke-width="1"/>
    <path d="M0 -15 L12 0 L0 15 L-12 0 Z" stroke="#0D9488" stroke-width="1.5" fill="none" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#0D9488" fill-opacity="0.3"/>
  </g>
  
  <!-- Center bottom ornament -->
  <g transform="translate(600, 560)">
    <line x1="-100" y1="0" x2="-30" y2="0" stroke="url(#frameGrad)" stroke-width="1"/>
    <line x1="30" y1="0" x2="100" y2="0" stroke="url(#frameGrad)" stroke-width="1"/>
    <path d="M0 -15 L12 0 L0 15 L-12 0 Z" stroke="#0D9488" stroke-width="1.5" fill="none" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#0D9488" fill-opacity="0.3"/>
  </g>
</svg>
