<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="mandalaCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  
  <!-- Center glow -->
  <circle cx="200" cy="200" r="180" fill="url(#mandalaCenter)"/>
  
  <!-- Outer rings -->
  <circle cx="200" cy="200" r="170" stroke="#0D9488" stroke-width="0.5" fill="none" stroke-opacity="0.15"/>
  <circle cx="200" cy="200" r="140" stroke="#0D9488" stroke-width="0.5" fill="none" stroke-opacity="0.12"/>
  <circle cx="200" cy="200" r="110" stroke="#10B981" stroke-width="0.5" fill="none" stroke-opacity="0.1"/>
  <circle cx="200" cy="200" r="80" stroke="#0D9488" stroke-width="0.5" fill="none" stroke-opacity="0.15"/>
  <circle cx="200" cy="200" r="50" stroke="#10B981" stroke-width="0.5" fill="none" stroke-opacity="0.12"/>
  <circle cx="200" cy="200" r="20" stroke="#0D9488" stroke-width="1" fill="none" stroke-opacity="0.2"/>
  
  <!-- Petal layers -->
  <!-- Outer petals (12) -->
  <g fill="url(#petalGrad)">
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(0 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(30 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(60 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(90 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(120 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(150 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(180 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(210 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(240 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(270 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(300 200 200)"/>
    <ellipse cx="200" cy="60" rx="15" ry="45" transform="rotate(330 200 200)"/>
  </g>
  
  <!-- Middle petals (8) -->
  <g fill="#0D9488" fill-opacity="0.12">
    <ellipse cx="200" cy="100" rx="12" ry="35" transform="rotate(22.5 200 200)"/>
    <ellipse cx="200" cy="100" rx="12" ry="35" transform="rotate(67.5 200 200)"/>
    <ellipse cx="200" cy="100" rx="12" ry="35" transform="rotate(112.5 200 200)"/>
    <ellipse cx="200" cy="100" rx="12" ry="35" transform="rotate(157.5 200 200)"/>
    <ellipse cx="200" cy="100" rx="12" ry="35" transform="rotate(202.5 200 200)"/>
    <ellipse cx="200" cy="100" rx="12" ry="35" transform="rotate(247.5 200 200)"/>
    <ellipse cx="200" cy="100" rx="12" ry="35" transform="rotate(292.5 200 200)"/>
    <ellipse cx="200" cy="100" rx="12" ry="35" transform="rotate(337.5 200 200)"/>
  </g>
  
  <!-- Inner petals (6) -->
  <g fill="#10B981" fill-opacity="0.15">
    <ellipse cx="200" cy="140" rx="10" ry="25" transform="rotate(0 200 200)"/>
    <ellipse cx="200" cy="140" rx="10" ry="25" transform="rotate(60 200 200)"/>
    <ellipse cx="200" cy="140" rx="10" ry="25" transform="rotate(120 200 200)"/>
    <ellipse cx="200" cy="140" rx="10" ry="25" transform="rotate(180 200 200)"/>
    <ellipse cx="200" cy="140" rx="10" ry="25" transform="rotate(240 200 200)"/>
    <ellipse cx="200" cy="140" rx="10" ry="25" transform="rotate(300 200 200)"/>
  </g>
  
  <!-- Center flower -->
  <g transform="translate(200, 200)">
    <ellipse cx="0" cy="-15" rx="6" ry="14" fill="#0D9488" fill-opacity="0.25"/>
    <ellipse cx="13" cy="-7" rx="6" ry="14" fill="#0D9488" fill-opacity="0.22" transform="rotate(60)"/>
    <ellipse cx="13" cy="7" rx="6" ry="14" fill="#0D9488" fill-opacity="0.25" transform="rotate(120)"/>
    <ellipse cx="0" cy="15" rx="6" ry="14" fill="#0D9488" fill-opacity="0.22" transform="rotate(180)"/>
    <ellipse cx="-13" cy="7" rx="6" ry="14" fill="#0D9488" fill-opacity="0.25" transform="rotate(240)"/>
    <ellipse cx="-13" cy="-7" rx="6" ry="14" fill="#0D9488" fill-opacity="0.22" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="8" fill="#0D9488" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#0D9488" fill-opacity="0.4"/>
  </g>
  
  <!-- Decorative dots at ring intersections -->
  <g fill="#0D9488" fill-opacity="0.2">
    <circle cx="200" cy="30" r="3"/>
    <circle cx="200" cy="370" r="3"/>
    <circle cx="30" cy="200" r="3"/>
    <circle cx="370" cy="200" r="3"/>
    
    <circle cx="86" cy="86" r="2.5"/>
    <circle cx="314" cy="86" r="2.5"/>
    <circle cx="86" cy="314" r="2.5"/>
    <circle cx="314" cy="314" r="2.5"/>
  </g>
  
  <!-- Small accent dots -->
  <g fill="#10B981" fill-opacity="0.15">
    <circle cx="140" cy="60" r="2"/>
    <circle cx="260" cy="60" r="2"/>
    <circle cx="60" cy="140" r="2"/>
    <circle cx="340" cy="140" r="2"/>
    <circle cx="60" cy="260" r="2"/>
    <circle cx="340" cy="260" r="2"/>
    <circle cx="140" cy="340" r="2"/>
    <circle cx="260" cy="340" r="2"/>
  </g>
</svg>
