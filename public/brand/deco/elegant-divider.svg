<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0"/>
      <stop offset="25%" stop-color="#0D9488" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="75%" stop-color="#0D9488" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="30%" stop-color="#34D399" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ornamentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Flowing wave lines -->
  <path d="M0 200 Q150 150 300 200 T600 200 T900 200 T1200 200" stroke="url(#waveGrad)" stroke-width="2" fill="none"/>
  <path d="M0 220 Q150 180 300 220 T600 220 T900 220 T1200 220" stroke="url(#waveGrad2)" stroke-width="1.5" fill="none"/>
  <path d="M0 180 Q150 220 300 180 T600 180 T900 180 T1200 180" stroke="url(#waveGrad)" stroke-width="1" fill="none" stroke-opacity="0.5"/>
  
  <!-- Center ornament -->
  <g transform="translate(600, 200)">
    <!-- Diamond shape -->
    <path d="M0 -30 L25 0 L0 30 L-25 0 Z" stroke="url(#ornamentGrad)" stroke-width="1.5" fill="none"/>
    <path d="M0 -20 L17 0 L0 20 L-17 0 Z" stroke="url(#ornamentGrad)" stroke-width="1" fill="none"/>
    <circle cx="0" cy="0" r="5" fill="#0D9488" fill-opacity="0.3"/>
    
    <!-- Side decorations -->
    <line x1="-80" y1="0" x2="-40" y2="0" stroke="url(#ornamentGrad)" stroke-width="1"/>
    <line x1="40" y1="0" x2="80" y2="0" stroke="url(#ornamentGrad)" stroke-width="1"/>
    <circle cx="-90" cy="0" r="3" fill="#0D9488" fill-opacity="0.25"/>
    <circle cx="90" cy="0" r="3" fill="#0D9488" fill-opacity="0.25"/>
    
    <!-- Small leaves -->
    <ellipse cx="-50" cy="-8" rx="12" ry="5" fill="#0D9488" fill-opacity="0.15" transform="rotate(-20 -50 0)"/>
    <ellipse cx="-50" cy="8" rx="12" ry="5" fill="#0D9488" fill-opacity="0.15" transform="rotate(20 -50 0)"/>
    <ellipse cx="50" cy="-8" rx="12" ry="5" fill="#0D9488" fill-opacity="0.15" transform="rotate(20 50 0)"/>
    <ellipse cx="50" cy="8" rx="12" ry="5" fill="#0D9488" fill-opacity="0.15" transform="rotate(-20 50 0)"/>
  </g>
  
  <!-- Scattered sparkles -->
  <g fill="#0D9488" fill-opacity="0.2">
    <circle cx="100" cy="180" r="2"/>
    <circle cx="200" cy="220" r="1.5"/>
    <circle cx="350" cy="190" r="2"/>
    <circle cx="850" cy="210" r="1.5"/>
    <circle cx="1000" cy="180" r="2"/>
    <circle cx="1100" cy="220" r="1.5"/>
  </g>
  
  <!-- Star sparkles -->
  <g fill="#0D9488" fill-opacity="0.15">
    <path d="M150 170 L152 176 L158 176 L153 180 L155 186 L150 182 L145 186 L147 180 L142 176 L148 176 Z"/>
    <path d="M1050 170 L1052 176 L1058 176 L1053 180 L1055 186 L1050 182 L1045 186 L1047 180 L1042 176 L1048 176 Z"/>
  </g>
</svg>
